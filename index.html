          <h1>Privacy Policy</h1>
          <p>Showing Ops ("we," "our," or "us") is committed to protecting your privacy. This policy explains what information we collect, how we use it, and your rights regarding that information.</p>

          <h2>1. Information We Collect</h2>
          <p>We collect information you provide directly, including:</p>
          <ul>
            <li><strong>First and last name</strong> &mdash; submitted when you opt in to SMS communications.</li>
            <li><strong>Phone number</strong> &mdash; submitted when you opt in to receive SMS notifications from Showing Ops.</li>
            <li><strong>Brokerage name</strong> &mdash; submitted to identify your real estate organization.</li>
            <li><strong>Communications</strong> &mdash; messages you send us via our contact channels.</li>
          </ul>
          <p>We may also collect certain technical data automatically, such as browser type, IP address, and pages visited, through standard web analytics tools.</p>

          <h2>2. How We Use Your Information</h2>
          <p>We use the information we collect to:</p>
          <ul>
            <li>Send transactional SMS workflow notifications to users who have explicitly opted in, including <strong>workflow approval requests, task reminders, and lead assignment notifications</strong>.</li>
            <li>Respond to inquiries and support requests.</li>
            <li>Improve and develop Showing Ops products and services.</li>
            <li>Comply with legal obligations.</li>
          </ul>
          <p>We will never sell your personal information to third parties.</p>

          <h2>3. SMS Communications</h2>
          <p>By providing your phone number and checking the SMS consent box, you consent to receive transactional SMS workflow notifications from Showing Ops. These messages are account-specific and include workflow approval requests, task reminders, and lead assignment notifications. Showing Ops does not send promotional or marketing SMS messages.</p>
          <p>Message frequency varies based on account activity. Message and data rates may apply. Reply <strong>STOP</strong> to unsubscribe or <strong>HELP</strong> for assistance.</p>
          <p><strong>No mobile information will be shared with third parties or affiliates for marketing or promotional purposes. Text messaging originator opt-in data and consent will not be shared with any third parties.</strong></p>
          <p>SMS opt-in is entirely voluntary.</p>

          <h2>4. Data Sharing</h2>
          <p><strong>We do NOT sell or share phone numbers with third parties under any circumstances.</strong></p>
          <p>We may share your information only with:</p>
          <ul>
            <li><strong>Service providers</strong> &mdash; trusted vendors who help us operate our platform (e.g., SMS messaging). These providers are bound by confidentiality obligations and are prohibited from using your data for their own purposes.</li>
            <li><strong>Legal authorities</strong> &mdash; where required by law, regulation, or valid legal process.</li>
          </ul>
          <p>We do not share your data with third-party advertisers, data brokers, or any marketing partners.</p>

          <h2>5. Data Retention</h2>
          <p>We retain your information for as long as necessary to fulfill the purposes described in this policy, or as required by law. You may request deletion of your data at any time by contacting us.</p>

          <h2>6. Your Rights &amp; Opt-Out</h2>
          <p>You have the right to access, correct, or delete the personal data we hold about you, and to withdraw consent for SMS communications at any time.</p>
          <p>To opt out of SMS: reply <strong>STOP</strong> to any text message from Showing Ops. For SMS help: reply <strong>HELP</strong>. For data deletion requests: contact us at <a href="mailto:showingops@gmail.com">showingops@gmail.com</a>.</p>

          <h2>7. Security</h2>
          <p>We take reasonable technical and organizational measures to protect your information against unauthorized access, loss, or misuse. However, no transmission over the internet is completely secure, and we cannot guarantee absolute security.</p>

          <h2>8. Changes to This Policy</h2>
          <p>We may update this Privacy Policy from time to time. When we do, we will revise the "Last updated" date at the top.</p>
